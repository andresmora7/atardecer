<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cuadro vivo</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Georgia, "Times New Roman", serif; }
    #inicio { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; padding: 2rem; text-align: center; background: #0E4D3C; color: #F2EFE6; }
    #inicio h1 { margin: 0; font-weight: normal; font-size: 2rem; line-height: 1.2; }
    #inicio p { margin: 0; max-width: 22rem; line-height: 1.6; opacity: .85; }
    #btn { font: inherit; font-size: 1.15rem; padding: .9rem 2.2rem; background: #F2EFE6; color: #0E4D3C; border: 0; border-radius: 999px; cursor: pointer; }
    #btn:disabled { opacity: .5; }
    #error { position: fixed; left: 1rem; right: 1rem; bottom: 2rem; z-index: 20; display: none; padding: 1rem; background: #fff; color: #900; font: 14px/1.4 monospace; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="inicio">
    <h1>Este cuadro tiene algo que contarte</h1>
    <p>Toca el botón, permite la cámara y apunta al cuadro.</p>
    <button id="btn">Empezar</button>
  </div>
  <div id="error"></div>

  <!-- El video va FUERA de a-assets para que no bloquee la carga en iPhone -->
  <audio id="musica" src="./musica.mp3" loop preload="none"></audio>
  <video id="vid" src="./video.mp4" loop muted playsinline webkit-playsinline preload="none" style="display:none"></video>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video id="pantalla" width="1" height="0.705" position="0 0 0" visible="false"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const video    = document.getElementById('vid');
    const target   = document.getElementById('target');
    const pantalla = document.getElementById('pantalla');
    const scene    = document.querySelector('a-scene');
    const errBox   = document.getElementById('error');
    const musicaTag= document.getElementById('musica'); // plan B si Web Audio falla

    function mostrarError(msg) { errBox.style.display = 'block'; errBox.textContent = 'Error: ' + msg; }
    window.addEventListener('error', e => mostrarError(e.message));
    window.addEventListener('unhandledrejection', e => mostrarError(e.reason && e.reason.message || e.reason));

    // ---- Música en bucle SIN corte (Web Audio) ----
    // Suena de corrido: el video puede reiniciarse mil veces y la canción nunca se entera.
    let ctx = null, gain = null, musicaLista = null, usarTag = false, tLost = null;
    const VOLUMEN = 0.7;

    function prepararMusica() {              // se llama dentro del toque del usuario
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
        ctx.resume();
        gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination);
        musicaLista = fetch('./musica.mp3')
          .then(r => r.arrayBuffer())
          .then(b => new Promise((ok, no) => ctx.decodeAudioData(b, ok, no)))
          .then(buf => {
            const src = ctx.createBufferSource();
            src.buffer = buf; src.loop = true; src.connect(gain); src.start(0);
            return ctx.suspend();
          })
          .catch(() => { usarTag = true; musicaTag.loop = true; });
      } catch (e) { usarTag = true; }
    }

    async function subirMusica() {
      clearTimeout(tLost);
      if (musicaLista) await musicaLista;
      if (usarTag) { musicaTag.volume = VOLUMEN; musicaTag.play().catch(()=>{}); return; }
      await ctx.resume();
      gain.gain.cancelScheduledValues(ctx.currentTime);
      gain.gain.setTargetAtTime(VOLUMEN, ctx.currentTime, 0.4);   // entra suave
    }

    function bajarMusica() {
      if (usarTag) { musicaTag.pause(); return; }
      if (!ctx) return;
      gain.gain.cancelScheduledValues(ctx.currentTime);
      gain.gain.setTargetAtTime(0, ctx.currentTime, 0.3);          // sale suave
      tLost = setTimeout(() => ctx.suspend(), 1500);               // queda pausada en ese punto
    }

    function arrancarAR() { scene.systems['mindar-image-system'].start(); }

    document.getElementById('btn').addEventListener('click', async (ev) => {
      ev.target.disabled = true;
      prepararMusica();                       // primero, mientras el toque sigue "fresco"
      video.load();
      try { await video.play(); video.pause(); video.currentTime = 0; } catch (e) {}
      pantalla.setAttribute('src', '#vid');
      document.getElementById('inicio').remove();
      if (scene.hasLoaded) arrancarAR(); else scene.addEventListener('loaded', arrancarAR, { once: true });
    });

    target.addEventListener('targetFound', () => { pantalla.setAttribute('visible', true); video.play(); subirMusica(); });
    target.addEventListener('targetLost',  () => { pantalla.setAttribute('visible', false); video.pause(); bajarMusica(); });
  </script>
</body>
</html>
